# Qwen3.6-35B-A3B served by SiliconFlow's OpenAI-compatible endpoint.
defaults:
  - Qwen3.6-35B-A3B-computer-use
  - _self_

model_name: Qwen/Qwen3.6-35B-A3B
model_pretty_name: Qwen3.6-35B-A3B-SiliconFlow
client_type: openai
base_url: https://api.siliconflow.cn/v1
api_key: ${oc.env:SILICONFLOW_API_KEY}

# Provide raw HTML and a structured AXTree alongside the screenshot.
# This maximizes page context at the cost of a larger input-token count.
use_html: true
use_axtree: true
use_screenshot: true
save_som: false
filter_visible_elements_only: true
extract_visible_tag: true
extract_clickable_tag: true
extract_coords: false
prompt_sections:
  - task
  - observation
  - history

# Deterministic GUI actions and bounded per-step output.
temperature: 0.0
max_tokens: 2048

# SiliconFlow chat/completions uses max_tokens and supports switching this
# model to non-thinking mode. The Agent's own short "Action:" planning prompt
# remains enabled; this only disables provider-side hidden reasoning tokens.
max_tokens_param: max_tokens
request_kwargs:
  enable_thinking: false
